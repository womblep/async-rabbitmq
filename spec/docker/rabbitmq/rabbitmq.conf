# Plain AMQP listener
listeners.tcp.default = 5672

# TLS AMQP listener
listeners.ssl.default = 5671

# TLS certificates (mounted from spec/docker/certs/ by docker-compose)
ssl_options.cacertfile = /etc/rabbitmq/certs/ca_certificate.pem
ssl_options.certfile   = /etc/rabbitmq/certs/server_certificate.pem
ssl_options.keyfile    = /etc/rabbitmq/certs/server_key.pem

# Verify client certificates if presented, but do not require them.
# Tests connect with VERIFY_NONE when no RABBITMQ_TLS_CA is set.
ssl_options.verify               = verify_peer
ssl_options.fail_if_no_peer_cert = false

# Enforce TLS 1.2+ — reject TLS 1.0 and TLS 1.1.
# The "refuses TLS 1.0" spec relies on this.
ssl_options.versions.1 = tlsv1.2
ssl_options.versions.2 = tlsv1.3

# Management HTTP API
management.listener.port = 15672
