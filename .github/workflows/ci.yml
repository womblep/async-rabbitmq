name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}

    strategy:
      matrix:
        ruby: ["3.4", "4.0"]

    env:
      # RabbitMQ plain connection
      RABBITMQ_URL:       amqp://guest:guest@127.0.0.1:15682
      RABBITMQ_HOST:      127.0.0.1
      RABBITMQ_PORT:      15682
      RABBITMQ_MGMT_PORT: 15680
      # RabbitMQ TLS — cert is generated by spec_helper via docker/gen-certs.sh
      RABBITMQ_TLS_PORT: 15681
      RABBITMQ_TLS_CA:   spec/docker/certs/ca_certificate.pem
      # Toxiproxy
      TOXIPROXY_HOST:              http://127.0.0.1:18474
      TOXIPROXY_RABBITMQ_PORT:     21111
      TOXIPROXY_RABBITMQ_UPSTREAM: rabbitmq:5672
      TOXIPROXY_RABBITMQ_LISTEN:   "0.0.0.0:11111"
      # Enforce 90% coverage when tests run against live services
      ENFORCE_COVERAGE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Generate TLS certificates
        run: |
          bash spec/docker/gen-certs.sh
          # Make certs readable by the RabbitMQ container (runs as uid 999)
          chmod 644 spec/docker/certs/*.pem

      - name: Create Docker network
        run: docker network create test-net

      - name: Prepare RabbitMQ data directory
        run: |
          # Pre-create data dir and cookie owned by rabbitmq (uid 999) so the
          # Erlang VM inside the container can read .erlang.cookie at boot.
          sudo mkdir -p /tmp/rabbitmq-data
          echo -n 'ci-test-cookie' | sudo tee /tmp/rabbitmq-data/.erlang.cookie > /dev/null
          sudo chmod 600 /tmp/rabbitmq-data/.erlang.cookie
          sudo chown -R 999:999 /tmp/rabbitmq-data

      - name: Start RabbitMQ
        run: |
          docker run -d --name rabbitmq --network test-net \
            -p 15682:5672 -p 15681:5671 -p 15680:15672 \
            -e RABBITMQ_ERLANG_COOKIE=ci-test-cookie \
            -v /tmp/rabbitmq-data:/var/lib/rabbitmq \
            -v ${{ github.workspace }}/spec/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro \
            -v ${{ github.workspace }}/spec/docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro \
            -v ${{ github.workspace }}/spec/docker/certs:/etc/rabbitmq/certs:ro \
            rabbitmq:4-management-alpine

      - name: Wait for RabbitMQ to be healthy
        run: |
          echo "Waiting for RabbitMQ..."
          for i in $(seq 1 30); do
            if docker exec rabbitmq rabbitmq-diagnostics -q ping 2>/dev/null; then
              echo "RabbitMQ is ready"
              exit 0
            fi
            sleep 2
          done
          echo "RabbitMQ failed to start"
          docker logs rabbitmq
          exit 1

      - name: Start Toxiproxy
        run: |
          docker run -d --name toxiproxy --network test-net \
            -p 18474:8474 -p 21111:11111 -p 21112:11112 \
            ghcr.io/shopify/toxiproxy:2.9.0 \
            -host=0.0.0.0

      - name: Wait for Toxiproxy
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://127.0.0.1:18474/version >/dev/null 2>&1; then
              echo "Toxiproxy is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Toxiproxy failed to start"
          docker logs toxiproxy
          exit 1

      - name: Run tests
        run: bundle exec rspec spec/integration/

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-ruby-${{ matrix.ruby }}
          path: coverage/

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f toxiproxy rabbitmq 2>/dev/null || true
          docker network rm test-net 2>/dev/null || true
