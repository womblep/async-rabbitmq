name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}

    strategy:
      matrix:
        ruby: ["3.2", "3.3", "3.4"]

    env:
      # RabbitMQ plain connection
      RABBITMQ_URL:       amqp://guest:guest@127.0.0.1:15682
      RABBITMQ_HOST:      127.0.0.1
      RABBITMQ_PORT:      15682
      RABBITMQ_MGMT_PORT: 15680
      # RabbitMQ TLS — cert is generated by spec_helper via docker/gen-certs.sh
      RABBITMQ_TLS_PORT: 15681
      RABBITMQ_TLS_CA:   spec/docker/certs/ca_certificate.pem
      # Toxiproxy
      TOXIPROXY_HOST:              http://127.0.0.1:18474
      TOXIPROXY_RABBITMQ_PORT:     21111
      TOXIPROXY_RABBITMQ_UPSTREAM: rabbitmq:5672
      TOXIPROXY_RABBITMQ_LISTEN:   "0.0.0.0:11111"
      # Enforce 90% coverage when tests run against live services
      ENFORCE_COVERAGE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # spec_helper.rb starts docker compose automatically (gen-certs + compose up --wait),
      # so no separate service containers or wait steps are needed here.
      - name: Run tests
        run: bundle exec rspec spec/integration/

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-ruby-${{ matrix.ruby }}
          path: coverage/
